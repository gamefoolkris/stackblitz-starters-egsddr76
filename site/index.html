
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Node-Controlled Site</title>
  </head>
  <body>
    <div id="app">Waiting for server...</div>

    <script type="module">
      import * as SocketIO from 'https://cdn.jsdelivr.net/npm/socket.io@4.8.4/+esm';

      const manager = new SocketIO.Manager(location.origin);
      const socket = new SocketIO.Socket(manager, '/');

      socket.on('connect', () => {
        console.log('Connected:', socket.id);
      });

      socket.on('log', (data) => {
        console.log(data);
      });

      socket.emit('log', {
        message: 'die',
        timestamp: Date.now()
      });
    </script>
  </body>
</html>
